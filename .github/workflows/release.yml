name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r services/backend/requirements.txt

      - name: Compile Python sidecar
        run: |
          pyinstaller --onefile --clean --name autometa-backend services/backend/main.py

      - name: Move Python sidecar to Tauri binaries folder
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp dist/autometa-backend.exe apps/desktop/src-tauri/binaries/autometa-backend-x86_64-pc-windows-msvc.exe
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp dist/autometa-backend apps/desktop/src-tauri/binaries/autometa-backend-aarch64-apple-darwin
          fi

      - name: Install Monorepo Web Dependencies
        run: |
          bun install

      - name: Build Web Frontend Assets
        run: |
          cd apps/web && bun run build

      - name: Build Web Assets & Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AUTOMETA v__VERSION__'
          releaseBody: |
            ## What's new in v0.2.0

            Since v0.1.0, Autometa grew from a diagram editor into a full automata-theory learning platform.

            ### Practice mode & learning paths
            - Auto-generated practice exercises (DFA/NFA/PDA/TM/Regex/CFG) with semantic grading — real counterexamples, not diagram-shape matching
            - Instructor authoring: build exercises and ordered lesson paths, track class progress in a new Gradebook
            - Per-profile student progress tracking

            ### Project library & collaboration
            - Save, tag, favorite, and clone projects; browse public projects from other local profiles
            - Explicit version history with restore/delete, and comment threads on projects
            - JSON "share package" export/import (self-contained, read-only aware)

            ### Interoperability
            - JFLAP `.jff` import/export (DFA/NFA, PDA, TM, Mealy)
            - Batch Mode: run generated or custom test strings across any automaton type, export CSV/JSON

            ### Deeper automaton theory tools
            - New "Compare & Combine" workspace: language equivalence, union/intersection/complement, NFA concatenation/star/reverse
            - CFG → CNF/GNF/PDA conversions and left-recursion/left-factoring elimination, all with step-by-step walkthroughs
            - DFA → Regex walkthrough, NFA ↔ regular-grammar conversions
            - Ambiguity detection with side-by-side derivation trees, CFG simplification (epsilon/unit/useless-symbol removal), grammar classification
            - Unrestricted (Type-0) grammar editor with bounded derivation search
            - Multi-tape Turing Machines (1–4 tapes), a reusable submachine library for TM/PDA fragments, and a PDA branch explorer

            ### Security & reliability
            - Content-Security-Policy locked down (was disabled entirely in v0.1.0)
            - Per-launch bearer token authenticates the desktop app to its local Python sidecar
            - LLM API keys now stored in the OS keychain instead of localStorage
            - Retry-with-backoff and structured logging for all LLM calls (Gemini/OpenAI/Groq/Ollama/custom)

            ### Accessibility & performance
            - ARIA labels on states/transitions, keyboard shortcut to add a state, fixed arrow-key focus conflict
            - Windowed rendering for long Turing Machine tape histories
            - New in-app Help Center

            ### Also in this release
            - Auto-updater wired in (Tauri v2 updater plugin)
            - Lesson Builder redesign with lesson history
            - Unified Settings (theme, custom LLM providers, submachine library manager)
            - 254 frontend + 56 backend automated tests (up from none at v0.1.0)

            **Full diff**: https://github.com/himanshuraiml/autometa/compare/v0.1.0...v0.2.0

            ---

            **macOS**: if Gatekeeper blocks the app, see the README's Gatekeeper bypass instructions.
            **Windows**: if SmartScreen blocks the installer, see the README's SmartScreen bypass guide.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: 'apps/desktop'
