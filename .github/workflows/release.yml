name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r services/backend/requirements.txt

      - name: Compile Python sidecar
        run: |
          pyinstaller --onefile --clean --name autometa-backend services/backend/main.py

      - name: Move Python sidecar to Tauri binaries folder
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp dist/autometa-backend.exe apps/desktop/src-tauri/binaries/autometa-backend-x86_64-pc-windows-msvc.exe
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp dist/autometa-backend apps/desktop/src-tauri/binaries/autometa-backend-aarch64-apple-darwin
          fi

      - name: Install Monorepo Web Dependencies
        run: |
          bun install

      - name: Build Web Frontend Assets
        run: |
          cd apps/web && bun run build

      - name: Build Web Assets & Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AUTOMETA v__VERSION__'
          releaseBody: |
            ## What's new in v0.2.2

            A branding and reliability update on top of v0.2.0.

            ### New app icon & branding
            - Fresh Autometa logo across every platform target: macOS, Windows, Android, and iOS app icons regenerated
            - New logo wired into the in-app sidebar

            ### Markdown rendering overhaul
            - Headers now support levels 1–6 (was capped at `###`)
            - Nested bullet/numbered lists preserve indentation hierarchy
            - Added support for `+`/`•` bullets, `*`/`_` italics, inline links, blockquotes, and horizontal rules
            - Cleaner LaTeX rendering (escaped braces/underscores normalized)

            ### Backend reliability
            - Lesson-generation JSON parsing now tolerates trailing commas and malformed model output instead of failing outright
            - Richer error logging for unparseable LLM responses (captures the raw text for debugging)
            - Fixed CORS preflight (`OPTIONS`) requests being incorrectly rejected by the sidecar's bearer-token auth check
            - Lesson slide titles are now optional and auto-populated instead of causing validation errors

            ### Build tooling
            - Desktop build now auto-detects the host target triple when compiling the Python sidecar, replacing a hardcoded build path

            **Full diff**: https://github.com/himanshuraiml/autometa/compare/v0.2.0...v0.2.2

            ---

            **macOS**: if Gatekeeper blocks the app, see the README's Gatekeeper bypass instructions.
            **Windows**: if SmartScreen blocks the installer, see the README's SmartScreen bypass guide.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: 'apps/desktop'
